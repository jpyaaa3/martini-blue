[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-camera-demo"
version = "0.1.0"
description = "A browser-based two-view Genesis mounted-camera driving demo"
requires-python = ">=3.10"
dependencies = [
  "genesis-world==1.2.0",
  "torch==2.12.1",
  "numpy>=1.26,<2",
  "Pillow==11.3.0",
  "trimesh>=4.8,<6",
  "opencv-python-headless>=4.8,<4.12",
  "imgui==2.0.0",
  "glfw>=2.6,<3",
  "PyOpenGL>=3.1.7,<4",
  "imageio-ffmpeg>=0.5,<0.7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
vision-demo = "vision_demo.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vision_demo = ["static/*.html", "static/*.js", "assets/*.obj", "assets/*.mtl", "assets/*.png", "maps/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
