[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-camera-demo"
version = "0.1.0"
description = "A two-window Genesis mounted-camera driving demo"
requires-python = ">=3.10"
dependencies = [
  "genesis-world==1.2.0",
  "torch==2.12.1",
  "numpy>=1.26,<2",
  "glfw==2.10.0",
  "imgui[glfw]==2.0.0",
  "PyOpenGL==3.1.10",
  "PyOpenGL-accelerate==3.1.10",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
vision-demo = "vision_demo.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
