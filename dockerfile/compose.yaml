name: vision-camera-demo

services:
  vision:
    build:
      context: ..
      dockerfile: dockerfile/Dockerfile
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    image: vision-camera-demo:dev
    container_name: vision-camera-demo
    command: ["sleep", "infinity"]
    stdin_open: true
    tty: true
    gpus: all
    devices:
      - /dev/dxg:/dev/dxg
    shm_size: "2gb"
    ports:
      - "127.0.0.1:${VISION_PORT:-8765}:8765"
    environment:
      DISPLAY: "${DISPLAY:-:0}"
      PYOPENGL_PLATFORM: egl
      VISION_BACKEND: "${VISION_BACKEND:-gpu}"
      VISION_HOST: "0.0.0.0"
      VISION_PORT: "8765"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      GALLIUM_DRIVER: d3d12
      MESA_D3D12_DEFAULT_ADAPTER_NAME: NVIDIA
      LD_LIBRARY_PATH: /usr/lib/wsl/lib:/usr/local/cuda/lib64
    volumes:
      - ..:/workspace/vision
      - /usr/lib/wsl:/usr/lib/wsl:ro
      # WSLg XWayland socket for the GLFW/ImGui window.
      - /mnt/wslg/.X11-unix:/tmp/.X11-unix:ro
    working_dir: /workspace/vision
